<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>It's For You - Now Smile!</title>

<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ================= LOADER ================= */
#loader {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #ffecd2, #fcb69f);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  overflow: hidden;
}

.plane-wrapper {
  position: absolute;
  top: 40%;
  left: -150px;
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: fly-once 3s ease-in-out forwards;
}

.plane-wrapper img {
  width: 80px; /* chota plane */
  margin-bottom: 10px;
}

.loading-text {
  font-family: 'Luckiest Guy', cursive;
  font-size: 15px;
  color: #ff6f61;
  white-space: nowrap;
}

/* ONE TIME reveal animation */
@keyframes fly-once {
  0% {
    left: -200px;
    opacity: 0;
  }
  20% {
    opacity: 1;
  }
  100% {
    left: 50%;
    transform: translateX(-50%);
    opacity: 1;
  }
}

/* hide loader */
.hide-loader {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.8s ease;
}
  

/* Plane movement */
@keyframes fly {
  0% { left: -250px; }
  100% { left: 110%; }
}

/* Hide loader smoothly */
.hide-loader {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.8s ease;
}

/* ================= MAIN PAGE ================= */
body {
  font-family: 'Comic Neue', cursive;
  background: linear-gradient(135deg, #ffecd2, #fcb69f);
  min-height: 100vh;
  margin: 0;
  padding: 20px;
  text-align: center;
  overflow-x: hidden;
}

h1 {
  font-family: 'Luckiest Guy', cursive;
  font-size: 3em;
  color: #ff6f61;
  text-shadow: 2px 2px #ff1493;
  animation: bounce 2s infinite;
}

@keyframes bounce {
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-20px)}
}

.video-container img {
  border-radius: 15px;
  box-shadow: 0 4px 8px rgba(0,0,0,.2);
}

.question {
  font-size: 1.5em;
  color: #ff4500;
}

.button-container {
  display: flex;
  justify-content: center;
  gap: 20px;
}

.button {
  padding: 15px 30px;
  background: #ff6f61;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-family: 'Luckiest Guy', cursive;
  cursor: pointer;
}

.hamster {
  border: 5px solid #ff6f61;
  border-radius: 50%;
  animation: hamster 3s infinite;
}

@keyframes hamster {
  0%{transform:scale(1)}
  50%{transform:scale(1.1) rotate(10deg)}
  100%{transform:scale(1)}
}

.play-music-button {
  margin-top: 40px;
  background: #ff6f61;
  color: #fff;
  border: none;
  padding: 15px 30px;
  border-radius: 10px;
  font-family: 'Luckiest Guy', cursive;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- ===== LOADER ===== -->
<div id="loader">
  <div class="plane-wrapper">
    <img src="./img/plane.png" alt="Plane">
    <div class="loading-text">Loading something special for you ✨</div>
  </div>
</div>

<!-- ===== MAIN CONTENT ===== -->
<h1>Hey!!!</h1>

<div class="video-container">
  <img src="./img/ahatamatar.gif" width="200">
</div>

<div class="question">
  <p>Have you slept well?</p>
</div>

<div class="button-container">
  <button class="button" onclick="nextQuestion()">Yes</button>
  <button class="button" onclick="nextQuestion()">No</button>
</div>

<div>
  <img src="./img/hamster.jpg" height="100" class="hamster">
</div>

<audio id="music" autoplay loop>
  <source src="./music/ahatamatarmusic.mp3" type="audio/mp3">
</audio>

<button class="play-music-button" onclick="playMusic()">Play Music</button>

<script>
function playMusic(){
  document.getElementById("music").play();
}

function nextQuestion(){
  window.location.href = "question2.html";
}

/* Loader hide after delay */
window.onload = () => {
  setTimeout(() => {
    document.getElementById("loader").classList.add("hide-loader");
  }, 3500);
};
</script>

</body>
</html>
